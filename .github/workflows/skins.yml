name: fetch-skins

on:
  workflow_dispatch:
    inputs:
      characters:
        description: Comma-separated character keys
        required: false
  push:
    paths:
      - tools/fetch_skins.py
      - .github/workflows/skins.yml

permissions:
  contents: write

jobs:
  skins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download candidate skins
        run: |
          pip install -q pillow
          mkdir -p skins_out
          python3 tools/fetch_skins.py skins_out ${{ inputs.characters || 'darkness,wiz,yunyun,luna,beldia,undead_knight,goblin,townsfolk' }} 2>&1 | tee skins_out/log.txt || true
          ls -la skins_out
      - name: Publish candidates
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd skins_out && zip -qr ../skins-candidates.zip . && cd ..
          gh release delete skins-candidates -y --cleanup-tag || true
          gh release create skins-candidates --prerelease --target "$GITHUB_SHA" \
            --title "Skin candidates" --notes "Скины-кандидаты для персонажей (служебный релиз)." \
            skins-candidates.zip $(ls skins_out/sheet_*.png 2>/dev/null)
