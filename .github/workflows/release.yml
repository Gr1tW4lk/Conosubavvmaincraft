name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
          rm -f build/libs/*-sources.jar
          ls -la build/libs
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$GITHUB_REF_NAME" -y || true
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "KonoCraft ${GITHUB_REF_NAME#v} — KonoSuba для Minecraft 1.20.1" \
            --notes-file .github/release-notes.md \
            build/libs/*.jar CREDITS.md
