name: release

# Publishes a public release whenever .github/release-version changes.
on:
  push:
    paths:
      - .github/release-version
  workflow_dispatch:

permissions:
  contents: write

# one release at a time: a newer push wins
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
          rm -f build/libs/*-sources.jar
          ls -la build/libs
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="$(tr -d ' \n' < .github/release-version)"
          TAG="v$VER"
          gh release delete "$TAG" -y --cleanup-tag || true
          create() {
            gh release create "$TAG" "$@" --latest \
              --title "KonoCraft $VER — KonoSuba для Minecraft 1.20.1" \
              --notes-file .github/release-notes.md \
              build/libs/*.jar CREDITS.md extras/mods/*.jar
          }
          create --target "$GITHUB_SHA" || create
